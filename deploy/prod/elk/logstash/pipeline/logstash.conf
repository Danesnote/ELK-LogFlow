# 운영: Kafka(SASL_SSL) → Logstash → Elasticsearch(HTTPS, 쓰기 전용 계정)
# ${...} 는 컨테이너 환경변수 (deploy/prod/elk/docker-compose.yml)
input {
  kafka {
    bootstrap_servers       => "${KAFKA_BOOTSTRAP}"
    topics                  => ["logs-topic"]
    group_id                => "logstash-logflow"   # 인스턴스 여러 대가 같은 그룹 → 파티션 분산
    client_id               => "logstash-logflow"
    consumer_threads        => 3                     # 인스턴스 2대 × 3 = 파티션 6개
    auto_offset_reset       => "earliest"
    codec                   => json

    security_protocol       => "SASL_SSL"
    sasl_mechanism          => "PLAIN"
    sasl_jaas_config        => "org.apache.kafka.common.security.plain.PlainLoginModule required username='logstash' password='${KAFKA_LOGSTASH_PASSWORD}';"
    ssl_truststore_location => "/usr/share/logstash/config/kafka/truststore.p12"
    ssl_truststore_password => "${KAFKA_TRUSTSTORE_PASSWORD}"
    ssl_truststore_type     => "PKCS12"
  }
}

filter {
  mutate {
    remove_field => ["agent", "ecs", "input", "[event][original]"]
  }
}

output {
  elasticsearch {
    hosts                       => ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
    user                        => "logstash_internal"
    password                    => "${LOGSTASH_ES_PASSWORD}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]

    index                       => "logflow-%{+YYYY.MM.dd}"
    data_stream                 => false
    manage_template             => false   # 템플릿·ILM 은 setup 컨테이너가 등록
    ilm_enabled                 => false
  }
}
