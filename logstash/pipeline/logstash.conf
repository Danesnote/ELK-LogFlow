# Filebeat → Kafka(logs-topic) → Logstash → Elasticsearch(logflow-YYYY.MM.dd)
input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics            => ["logs-topic"]
    group_id          => "logstash-logflow"
    auto_offset_reset => "earliest"   # 처음 뜰 때 토픽에 쌓여 있던 로그부터 소비
    codec             => json         # Filebeat 가 보낸 이벤트(JSON) 그대로 복원
  }
}

filter {
  # 수집 경로에서 붙은 메타 필드 정리 (event.original 은 원문 JSON 중복본)
  mutate {
    remove_field => ["agent", "ecs", "input", "[event][original]"]
  }
}

output {
  elasticsearch {
    hosts       => ["http://elasticsearch:9200"]
    index       => "logflow-%{+YYYY.MM.dd}"
    data_stream => false
    ilm_enabled => false
  }
}
