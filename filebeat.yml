filebeat.inputs:
  # 8.x 에서 deprecated 된 log 입력 대신 filestream 사용
  - type: filestream
    id: logflow-app
    paths:
      - /logs/*.log  # Spring Boot JSON 로그 경로 (롤링된 *.gz 는 제외됨)
    parsers:
      # logback LogstashEncoder 가 남긴 한 줄짜리 JSON 을 필드로 펼침
      - ndjson:
          target: ""            # 최상위 필드로 (level, logger_name, stack_trace ...)
          overwrite_keys: true  # 로그의 @timestamp, message 로 덮어씀
          add_error_key: true   # 파싱 실패 시 error.message 필드 추가
          message_key: message

processors:
  - drop_fields:
      fields: ["agent.ephemeral_id", "agent.id", "ecs.version"]
      ignore_missing: true

# Kafka 로 보내고 Logstash 가 소비해서 Elasticsearch 에 적재 (logstash/pipeline/logstash.conf)
output.kafka:
  hosts: ["kafka:29092"]
  topic: "logs-topic"
  required_acks: 1     # 리더 기록 확인 후 전송 완료 처리
  compression: gzip
