# 로컬 데모용 단일 호스트 구성 (운영 구성은 deploy/prod 참고)
# 파이프라인: spring-boot ─(./logs JSON)→ filebeat → kafka → logstash → elasticsearch → kibana
services:
  spring-boot:
    build:
      context: .  # 현재 폴더 (Spring Boot 프로젝트)
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      LOGGING_FILE_NAME: /logs/app.log  # 아래 ./logs 볼륨에 JSON 로그를 남김
    volumes:
      - ./logs:/logs  # 로그 파일 공유 (filebeat 와 같은 경로)

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.10.0
    user: root
    # Windows/macOS 바인드 마운트는 권한 검사를 통과하지 못하므로 끔
    command: ["filebeat", "-e", "--strict.perms=false"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/logs:ro  # Spring Boot 로그 마운트
      - filebeatdata:/usr/share/filebeat/data  # 읽은 위치(registry) 보존 → 재시작해도 중복 수집 안 함

  # ZooKeeper 없이 KRaft 모드로 단일 노드가 broker + controller 역할을 함께 수행
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9092:9092"  # 호스트에서 접근할 때는 localhost:9092
    environment:
      CLUSTER_ID: "TG9nRmxvd0RlbW9DbHVzdA"  # KRaft 스토리지 포맷용 고정 ID (16바이트 base64url 22자)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 컨테이너끼리는 kafka:29092, 호스트에서는 localhost:9092, 컨트롤러 통신은 29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"  # logs-topic 은 첫 전송 시 자동 생성
      KAFKA_NUM_PARTITIONS: 3                  # Logstash 를 여러 대로 늘려도 파티션을 나눠 가질 수 있게
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.0
    depends_on:
      kafka:
        condition: service_healthy
      es-setup:
        condition: service_completed_successfully  # 템플릿·ILM 등록 후에 첫 인덱스를 만들도록
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "9600:9600"  # 모니터링 API (curl localhost:9600/_node/stats/pipelines)

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ILM 정책(30일 후 삭제)과 logflow-* 인덱스 템플릿(필드 매핑 고정)을 등록하고 종료하는 1회성 컨테이너
  es-setup:
    image: curlimages/curl:8.10.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"
    environment:
      ES_URL: http://elasticsearch:9200
    volumes:
      - ./elasticsearch:/setup:ro
    entrypoint: ["sh", "/setup/setup.sh"]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.0
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Kibana 에 logflow-* 데이터 뷰를 만들고 종료하는 1회성 컨테이너
  kibana-setup:
    image: curlimages/curl:8.10.1
    depends_on:
      kibana:
        condition: service_healthy
    restart: "no"
    command:
      - -s
      - -X
      - POST
      - http://kibana:5601/api/data_views/data_view
      - -H
      - "kbn-xsrf: true"
      - -H
      - "Content-Type: application/json"
      - -d
      - '{"override":true,"data_view":{"id":"logflow","title":"logflow-*","name":"LogFlow logs","timeFieldName":"@timestamp"}}'

volumes:
  esdata:
  kafkadata:
  filebeatdata:
