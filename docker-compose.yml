services:
  spring-boot:
    build:
      context: .  # 현재 폴더 (Spring Boot 프로젝트)
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      LOGGING_FILE_NAME: /logs/app.log  # 아래 ./logs 볼륨에 JSON 로그를 남김
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATA_REDIS_HOST: redis
    volumes:
      - ./logs:/logs  # 로그 파일 공유 (filebeat 와 같은 경로)
    depends_on:
      - elasticsearch
      - redis

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.0
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Kibana 에 filebeat-* 데이터 뷰를 만들고 종료하는 1회성 컨테이너
  kibana-setup:
    image: curlimages/curl:8.10.1
    depends_on:
      kibana:
        condition: service_healthy
    restart: "no"
    command:
      - -s
      - -X
      - POST
      - http://kibana:5601/api/data_views/data_view
      - -H
      - "kbn-xsrf: true"
      - -H
      - "Content-Type: application/json"
      - -d
      - '{"override":true,"data_view":{"id":"logflow","title":"filebeat-*","name":"LogFlow logs","timeFieldName":"@timestamp"}}'

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.10.0
    user: root
    # Windows/macOS 바인드 마운트는 권한 검사를 통과하지 못하므로 끔
    command: ["filebeat", "-e", "--strict.perms=false"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/logs:ro  # Spring Boot 로그 마운트
      - filebeatdata:/usr/share/filebeat/data  # 읽은 위치(registry) 보존 → 재시작해도 중복 수집 안 함

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Kafka 경유 파이프라인용 (현재 filebeat 는 ES 로 직접 전송). 필요할 때만:
  #   docker compose --profile kafka up -d
  # cp-kafka 8.x 는 ZooKeeper 를 지원하지 않으므로 7.x 로 고정
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    profiles: ["kafka"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    profiles: ["kafka"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  esdata:
  redisdata:
  filebeatdata:
